name: 아파트별 공개 맛집 페이지 (D-113)
# 알림 서버가 월요일 04~05시(KST)에 Firestore publicPages 를 새로 쓴다 → 아침에 그 숫자로 kiwoot.com/a/… 와 sitemap 을 다시 만든다.
# 키·비밀값 없음(publicPages 는 누구나 읽기). 공개 저장소라 Actions 무료.
on:
  schedule:
    - cron: '17 22 * * 0'   # 월요일 07:17 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apartment-pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/apartment_pages.py
      - name: 바뀐 페이지 올리기
        run: |
          if [ -n "$(git status --porcelain -- a sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A a sitemap.xml
            git commit -m "아파트별 공개 맛집 페이지 갱신 (D-113)"
            git push
          else
            echo "바뀐 것 없음"
          fi
