<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF5">
<meta name="robots" content="noindex">
<title>기웃기웃 테스터 모집 마무리</title>
<meta property="og:type" content="website"><meta property="og:site_name" content="기웃기웃">
<meta property="og:title" content="기웃기웃이 문을 열었어요">
<meta property="og:description" content="기웃기웃이 정식으로 문을 열었어요. Google Play에서 받아 보세요.">
<meta property="og:url" content="https://kiwoot.com/tester"><meta property="og:image" content="https://kiwoot.com/img/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="우리 동네 맛집을 이웃과 함께 만드는 앱, 정식 출시 전에 먼저 써 보세요.">
<style>
  :root {
    --bg: #FFFBF5; --card: #FFFFFF; --ink: #3B2A20; --sub: #7A685C;
    --line: #EADFD3; --accent: #E8743B; --soft: #FFF1E6; --ok: #2E7D4F;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1E1713; --card: #2A201A; --ink: #F5ECE4; --sub: #BBA999; --line: #43342B; --accent: #F08A57; --soft: #3A2A20; --ok: #6FCB93; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(232,116,59,.18); }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.75 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    word-break: keep-all; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 26px; line-height: 1.35; margin: 0 0 8px; }
  .lead { color: var(--sub); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px; margin: 16px 0; }
  .step { display: flex; gap: 12px; align-items: flex-start; }
  .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff;
    font-weight: 700; display: grid; place-items: center; margin-top: 2px; }
  h2 { font-size: 20px; margin: 0 0 6px; line-height: 1.4; }
  p { margin: 6px 0; }
  .note { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin: 12px 0 0; font-size: 15.5px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 56px; text-align: center; text-decoration: none;
    background: var(--accent); color: #fff; font-size: 18px; font-weight: 700; padding: 12px 16px; border-radius: 14px; margin: 14px 0 4px; border: 0; width: 100%; font-family: inherit; cursor: pointer; }
  .btn:active { transform: scale(.98); filter: brightness(.93); }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 20px; }
  .quick .btn { margin: 0; font-size: 16px; min-height: 52px; }
  .quick .btn.ghost { background: var(--card); }
  .step-wrap { scroll-margin-top: 12px; }
  .btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .mock { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; margin: 12px 0 0; background: var(--bg); text-align: center; font-size: 15px; color: var(--sub); }
  .mock b.fake { display: inline-block; border: 1px solid #2563eb; color: #2563eb; border-radius: 6px; padding: 6px 14px; background: #fff; font-weight: 600; }
  .mock b.fake.green { border-color: var(--ok); color: var(--ok); }
  ul { padding-left: 20px; margin: 6px 0; }
  li { margin: 4px 0; }
  .apt { columns: 1; list-style: none; padding: 0; margin: 8px 0 0; }
  .apt li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .apt li:last-child { border-bottom: 0; }
  .apt .dong { color: var(--sub); font-size: 14.5px; margin-left: 6px; }
  .small { font-size: 14.5px; color: var(--sub); }
  details { margin: 8px 0; }
  summary { cursor: pointer; font-weight: 600; padding: 12px 0; min-height: 48px; }
  @media (max-width: 380px) { body { font-size: 16px; } h1 { font-size: 23px; } .card { padding: 16px 14px; } .num { width: 30px; height: 30px; } }
</style>
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="96x96" href="/img/favicon-96.png"><link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png"><link rel="apple-touch-icon" href="/img/icon-192.png">
</head>
<body>
<div class="wrap">
  <h1>테스터 모집은 마무리했어요</h1>
  <p class="lead">함께 써 주신 이웃 덕분에 <b>기웃기웃</b>이 정식으로 문을 열었어요. 이제 Google Play에서 바로 받을 수 있어요.</p>
  <div class="quick">
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.twoguns.kiwoot">Google Play에서 받기</a>
    <a class="btn ghost" href="./" style="border:2px solid var(--accent);color:var(--accent)">기웃기웃 소개 보기</a>
  </div>
  <p class="small" style="text-align:center">기웃기웃</p>
</body>
</html>
