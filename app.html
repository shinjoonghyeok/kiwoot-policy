<script>
// 앱 공유 글의 링크 하나 (2026-11-28 PM): 폰 종류를 보고 맞는 스토어로 바로 보낸다 — 안드로이드 → Google Play, 아이폰 → App Store, 그 밖(PC)은 두 단추.
// 보낸 사람·가게 정보는 받지 않는다(주소에 아무것도 싣지 않음). 앱이 깔린 폰은 카카오톡 카드 "앱에서 보기"가 앱을 연다.
(function () {
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1), android = /Android/.test(ua);
  if (android) { document.getElementById('ios-row').hidden = true; location.replace(document.getElementById('play').href); }
  else if (ios) { document.getElementById('play-row').hidden = true; location.replace(document.getElementById('ios').href); }
})();
